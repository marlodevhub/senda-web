<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9B3558" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Senda</title>
    <!--
      Pantalla de arranque de la app instalada (start_url del manifiesto): el logotipo con "Senda" a la derecha, quieto
      en el centro, sobre el degradado rojo; es la misma imagen que el arranque de iPhone/iPad (splash/*.png), así que
      no se nota el paso. El service worker (sw.js) la guarda en el teléfono, así que aparece al instante aunque el
      servidor tarde en despertar; cuando el servidor responde, pasa a Inicio. No guarda ni muestra nada del estudiante.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #c24a72 0%, #9b3558 45%, #6e1f3d 100%) fixed;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      img {
        width: 13rem;
        height: auto;
      }
      /* El aviso va abajo, aparte: el logotipo queda siempre en el centro exacto. */
      p {
        position: fixed;
        inset-inline: 0;
        bottom: 18%;
        margin: 0;
        text-align: center;
        font-size: 1rem;
        opacity: 0;
        transition: opacity 0.4s;
      }
      p.visible {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <img src="/icons/splash-lockup.svg" alt="Senda" />
    <p id="status" role="status"></p>
    <script>
      (function () {
        var status = document.getElementById("status");
        var tries = 0;
        // Sin conexión, se dice sin alarma y se reintenta solo.
        function open() {
          fetch("/manifest.webmanifest", { cache: "no-store" })
            .then(function (response) {
              if (!response.ok) throw new Error(String(response.status));
              location.replace("/inicio");
            })
            .catch(function () {
              tries += 1;
              if (!navigator.onLine) {
                status.textContent = "Sin conexión. Volveremos a intentarlo.";
                status.className = "visible";
              }
              setTimeout(open, Math.min(1000 * tries, 5000));
            });
        }
        open();
      })();
    </script>
  </body>
</html>
